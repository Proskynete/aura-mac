name: CI (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar y probar
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Swift
        run: swift --version

      - name: Pruebas del núcleo
        run: ./scripts/test.sh

      - name: Compilar Aura.app (Apple Silicon + Intel)
        run: ARCH=universal ./scripts/build.sh

      - name: Probar el comando aura
        run: build/Aura.app/Contents/Helpers/aura --version

      - name: Guardar Aura.app
        uses: actions/upload-artifact@v4
        with:
          name: Aura.app
          path: build/Aura.app
          retention-days: 7
